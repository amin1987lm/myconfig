name: VLESS Server

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Install Xray
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Generate Keys
        run: |
          ./xray x25519 > keys.txt
          PUBLIC_KEY=$(grep "Public key:" keys.txt | cut -d " " -f 3)
          PRIVATE_KEY=$(grep "Private key:" keys.txt | cut -d " " -f 3)
          SHORT_ID=$(openssl rand -hex 8)
          echo "PUBLIC_KEY=$PUBLIC_KEY" >> $GITHUB_ENV
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> $GITHUB_ENV
          echo "SHORT_ID=$SHORT_ID" >> $GITHUB_ENV

      - name: Create Config
        run: |
          cat > config.json << EOF
          {
            "inbounds": [{
              "port": 443,
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "c9e90144-6d1c-4ce2-bbeb-a6b08095992d", "flow": "xtls-rprx-vision"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "reality",
                "realitySettings": {
                  "dest": "www.google.com:443",
                  "serverNames": ["www.google.com"],
                  "privateKey": "${{ env.PRIVATE_KEY }}",
                  "shortIds": ["${{ env.SHORT_ID }}"]
                }
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF

      - name: Run Xray
        run: |
          nohup ./xray run -c config.json > xray.log 2>&1 &

      - name: Show Link
        run: |
          sleep 3
          IP=$(curl -s ifconfig.me)
          echo "========================================="
          echo "vless://c9e90144-6d1c-4ce2-bbeb-a6b08095992d@$IP:443?encryption=none&flow=xtls-rprx-vision&security=reality&sni=www.google.com&fp=chrome&pbk=${{ env.PUBLIC_KEY }}&type=tcp&headerType=none&shortId=${{ env.SHORT_ID }}#GitHub-VLESS"
          echo "========================================="

      - name: Keep Alive
        run: sleep 86400
